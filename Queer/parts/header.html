     <!-- 
      SEAMLESS DIAGONAL RAINBOW OVERLAY WITH ANIMATED BLACK TOP & BOTTOM BORDERS
      6 Parallel SVG Paths + 2 Border Paths mapped cleanly along the bottom diagonal vector (0, 40) to (1000, 0)
    -->
    <svg class="rainbow-border-svg" viewBox="0 0 1000 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <!-- TOP BLACK BORDER LINE (Sits directly above Red stroke) -->
      <path class="border-path border-top scroll-path" d="M 0,23 L 1000,-17" />

      <!-- 6 Parallel Colors stacked neatly with vertical Y offset -->
      <path class="rainbow-path path-red scroll-path"    d="M 0,25 L 1000,-15" stroke-width="3" />
      <path class="rainbow-path path-orange scroll-path" d="M 0,28 L 1000,-12" stroke-width="3" />
      <path class="rainbow-path path-yellow scroll-path" d="M 0,31 L 1000,-9"  stroke-width="3" />
      <path class="rainbow-path path-green scroll-path"  d="M 0,34 L 1000,-6"  stroke-width="3" />
      <path class="rainbow-path path-blue scroll-path"   d="M 0,37 L 1000,-3"  stroke-width="3" />
      <path class="rainbow-path path-purple scroll-path" d="M 0,40 L 1000,0"   stroke-width="3" />

      <!-- BOTTOM BLACK BORDER LINE (Sits directly below Purple stroke) -->
      <path class="border-path border-bottom scroll-path" d="M 0,42 L 1000,2" />
    </svg>
</header>
